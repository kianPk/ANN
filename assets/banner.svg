<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Kian Zarandi - Rust Go Flutter Vue">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="45%" stop-color="#151c24"/>
      <stop offset="100%" stop-color="#1a2430"/>
    </linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e4572e"/>
      <stop offset="100%" stop-color="#c9851a"/>
    </linearGradient>
    <linearGradient id="slag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6f8b"/>
      <stop offset="100%" stop-color="#3dffa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#e4572e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e4572e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- orbit ring -->
  <circle cx="980" cy="120" r="96" fill="none" stroke="#1f6f8b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 10"/>
  <circle cx="980" cy="120" r="62" fill="none" stroke="#e4572e" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="980" cy="120" r="28" fill="url(#forge)" opacity="0.9"/>

  <!-- accent bar -->
  <rect x="64" y="78" width="72" height="6" rx="3" fill="url(#forge)"/>

  <text x="64" y="140" fill="#f3f6f8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial" font-size="54" font-weight="800" letter-spacing="-1.5">KIAN ZARANDI</text>
  <text x="64" y="182" fill="#e4572e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="3">RUST � GO � FLUTTER � VUE � SECURITY</text>
  <text x="64" y="230" fill="#9aa8b5" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial" font-size="20">Load forges � API gateways � realtime hubs � live demos</text>

  <!-- stack chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="64" y="262" width="78" height="28" rx="6" fill="#1f2a35" stroke="#e4572e" stroke-opacity="0.5"/>
    <text x="103" y="280" fill="#f3f6f8" text-anchor="middle">Tokio</text>
    <rect x="152" y="262" width="72" height="28" rx="6" fill="#1f2a35" stroke="#1f6f8b" stroke-opacity="0.6"/>
    <text x="188" y="280" fill="#f3f6f8" text-anchor="middle">Axum</text>
    <rect x="234" y="262" width="58" height="28" rx="6" fill="#1f2a35" stroke="#3dffa8" stroke-opacity="0.35"/>
    <text x="263" y="280" fill="#f3f6f8" text-anchor="middle">Go</text>
    <rect x="302" y="262" width="88" height="28" rx="6" fill="#1f2a35" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="346" y="280" fill="#f3f6f8" text-anchor="middle">Flutter</text>
    <rect x="400" y="262" width="70" height="28" rx="6" fill="#1f2a35" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="435" y="280" fill="#f3f6f8" text-anchor="middle">Vue 3</text>
  </g>

  <text x="980" y="250" fill="#9aa8b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">@kianPk</text>
  <text x="980" y="272" fill="url(#slag)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" font-weight="700">SHIP � DEMO � REPEAT</text>
</svg>
